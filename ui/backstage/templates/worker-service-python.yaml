apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: worker-service-python
  title: Worker/Job Service (Python)
  description: Create a Python worker service with GitOps overlays
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Service info
      required: [tenant_id, service_name, owner]
      properties:
        tenant_id:
          type: string
        service_name:
          type: string
        owner:
          type: string
  steps:
    - id: scaffold
      name: Scaffold through Platform API
      action: http:backstage:request
      input:
        method: POST
        path: /platform-api/tenants/${{ parameters.tenant_id }}/scaffold
        body:
          template_id: python-worker
          parameters:
            service_name: ${{ parameters.service_name }}
            owner: ${{ parameters.owner }}
