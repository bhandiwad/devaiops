apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: web-service-python-fastapi
  title: Web Service (Python FastAPI)
  description: Create a FastAPI service with CI and GitOps overlays
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Service info
      required: [tenant_id, service_name, owner]
      properties:
        tenant_id:
          type: string
        service_name:
          type: string
        owner:
          type: string
        service_description:
          type: string
  steps:
    - id: scaffold
      name: Scaffold through Platform API
      action: http:backstage:request
      input:
        method: POST
        path: /platform-api/tenants/${{ parameters.tenant_id }}/scaffold
        body:
          template_id: python-fastapi
          parameters:
            service_name: ${{ parameters.service_name }}
            owner: ${{ parameters.owner }}
            service_description: ${{ parameters.service_description }}
  output:
    links:
      - title: Repository
        url: ${{ steps.scaffold.output.body.repo_url }}
