replicaCount: 2
image:
  repository: ghcr.io/example/platform-api
  tag: "0.7.0"
  pullPolicy: IfNotPresent
service:
  port: 8000
resources: {}
env:
  PLATFORM_CONFIG_PATH: /etc/platform/platform_config.yaml
  DEV_AUTH: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
rateLimit:
  windowSeconds: 60
  maxRequests: 300
