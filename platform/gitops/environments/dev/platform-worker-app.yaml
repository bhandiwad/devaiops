apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-worker-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git.example/platform-gitops
    targetRevision: main
    path: platform/charts/platform-worker
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
