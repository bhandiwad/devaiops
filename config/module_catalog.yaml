
modules:
  - id: "gitops.argocd"
    version: "0.7.0"
    type: "INSTALL"
    scope: "management"
    requirements:
      adapters: ["gitops"]
      capabilities: {}
      optional: false
    install:
      argo_application_template:
        metadata:
          name: "{{tenant_id}}-gitops-argocd"
        spec:
          project: "{{tenant_id}}"
          source:
            repoURL: "{{tenant_repo_url}}"
            targetRevision: "{{tenant_default_branch}}"
            path: "modules/gitops/argocd"
            helm:
              values: ""
          destination:
            server: "https://kubernetes.default.svc"
            namespace: "argocd"

  - id: "secrets.vault"
    version: "0.7.0"
    type: "INSTALL"
    scope: "management"
    requirements:
