version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: aiops-platform-postgres
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: aiops-platform-redis
    ports:
      - "6379:6379"
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: aiops-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - /Users/pb/devops_ai/aiops_platform_docs/dev/keycloak/realm.json:/opt/keycloak/data/import/realm.json
  ollama:
    image: ollama/ollama:latest
    container_name: aiops-ollama
    ports:
      - "11434:11434"
volumes:
  postgres_data:
