[project]
name = "aiops-platform-api"
version = "0.1.0"
description = "AIOps Platform API"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "jsonschema>=4.22",
  "SQLAlchemy>=2.0",
  "asyncpg>=0.29",
  "celery>=5.4",
  "redis>=5.0",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  "httpx>=0.27",
  "kubernetes>=30.1",
  "pyjwt>=2.9",
  "cryptography>=42.0",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.uv]
package = false
